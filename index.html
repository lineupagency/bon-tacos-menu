<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Menu Bon Tacos – French tacos, plac Dominikański 3, Wrocław.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Bon Tacos – Menu</title>
<meta name="theme-color" content="#121618">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Poppins:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: digital menu board. Ink screen, deep-red packshots glowing in a 2-col grid (4-col desktop),
   giant category headers, yellow price badges, sticky tabs. Single dark look by choice. */
:root {
  --ink: #121618; --panel: #1b2023; --line: #2a3135;
  --cream: #fff7ea; --muted: #a9a196;
  --red: #ed1b2e; --wine: #9e1620; --yellow: #fec231;
  --font-display: "Climate Crisis", "Arial Black", Impact, sans-serif;
  --font-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ink); color: var(--cream); font-family: var(--font-body); font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.gutter { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { display: flex; align-items: center; gap: 12px; padding-block: 16px 12px; }
.logo { width: 52px; height: 52px; flex: none; border-radius: 50%; overflow: hidden; background: #fff; box-shadow: 0 0 0 3px var(--red); }
.logo svg { width: 100%; height: 100%; display: block; }
.brand { min-width: 0; flex: 1; }
.brand b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 6vw, 34px); line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.brand small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: #2fd06f; box-shadow: 0 0 8px #2fd06f; }
.chip.closed i { background: var(--muted); box-shadow: none; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(18, 22, 24, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.tabrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); max-width: 1180px; margin: 0 auto; }
.tabrow::-webkit-scrollbar { display: none; }
.tabrow a { flex: none; min-height: 38px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: .02em; text-transform: uppercase; }
.tabrow a[aria-current="true"] { background: var(--yellow); color: var(--ink); }

.sec { padding-top: 34px; scroll-margin-top: calc(70px + env(safe-area-inset-top, 0px)); }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 3px solid var(--red); padding-bottom: 10px; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 400; text-transform: uppercase; font-size: clamp(28px, 8vw, 52px); line-height: .95; text-wrap: balance; }
.sec-sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

.switch { display: inline-grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.switch button { border: 0; background: none; cursor: pointer; border-radius: 9px; min-height: 40px; padding: 0 14px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.switch button[aria-pressed="true"] { background: var(--red); color: var(--cream); }

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; display: grid; gap: 8px; }
.ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #b11c27, var(--wine) 70%); box-shadow: 0 10px 30px -10px rgba(237, 27, 46, .45); }
.ph img { width: 100%; height: 100%; object-fit: cover; transition: opacity .2s; }
.ph.noimg::after { content: attr(data-ph); position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: rgba(255, 247, 234, .5); text-transform: uppercase; }
.badge { position: absolute; left: 8px; bottom: 8px; padding: 5px 10px 4px; border-radius: 8px; background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; box-shadow: 0 4px 12px rgba(0, 0, 0, .35); }
.badge small { font-weight: 700; font-size: 10px; display: block; line-height: 1.1; }
.name { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.tile.na .ph img { filter: grayscale(1); opacity: .35; }
.tile.na .badge { background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 700; }

footer { margin-top: 48px; padding-block: 28px calc(32px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: #0d1012; }
.foot { display: grid; gap: 24px; }
footer h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 16px; text-transform: uppercase; color: var(--yellow); }
footer p { margin: 0; font-size: 14px; }
.hours { list-style: none; margin: 0; padding: 0; max-width: 320px; }
.hours li { display: flex; justify-content: space-between; gap: 16px; padding: 4px 10px; border-radius: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.hours li.is-today { background: var(--yellow); color: var(--ink); font-weight: 800; }
.fine { color: var(--muted); font-size: 12px; }

@media (min-width: 760px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .name { font-size: 15px; }
  .badge { font-size: 17px; }
  .foot { grid-template-columns: 1.2fr 1fr 1fr; }
  .tabrow { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .ph img { transition: none; } }
</style>
</head>

    ul.appendChild(li);
  });
}
function openUntil() {
  var t = HOURS[DOW], y = HOURS[(DOW + 6) % 7];
  if (y[2] < y[1] && HNOW < y[2]) return y[2];
  var close = t[2] < t[1] ? t[2] + 24 : t[2];
  if (HNOW >= t[1] && HNOW < close) return t[2];
  return null;
}
function openChip(el) {
  var u = openUntil();
  el.querySelector("span").textContent = u !== null ? "Otwarte do " + hhmm(u) : "Teraz zamknięte";
  if (u === null) el.classList.add("closed");
  el.hidden = false;
}
// Scroll-spy: marks the nav link of the section under the sticky bar with aria-current.
function setupSpy(nav, bar) {
  var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
  function set(id) {
    links.forEach(function (a) {
      var on = a.dataset.id === id;
      if (on && a.getAttribute("aria-current") !== "true") {
        nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: "smooth" });
      }
      a.setAttribute("aria-current", String(on));
    });
  }
  function spy() {
    var line = bar.getBoundingClientRect().bottom + 40, id = MENU[0].id;
    MENU.forEach(function (s) { var el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top <= line) id = s.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) id = MENU[MENU.length - 1].id;
    set(id);
  }
  var tick = false;
  window.addEventListener("scroll", function () { if (!tick) { tick = true; requestAnimationFrame(function () { spy(); tick = false; }); } }, { passive: true });
  window.addEventListener("resize", spy);
  spy();
}

(function () {
  var main = document.getElementById("menu"), cats = document.getElementById("cats"), gratine = false;
  function tile(it, si, i) {
    var price = zl(it.p) + (MENU[si].drinks ? "<small>+ " + zl(DEPOSIT) + " kaucji</small>" : "");
    return '<li class="tile" data-s="' + si + '" data-i="' + i + '"><div class="ph" data-ph="' + esc(it.n) + '">' +
      '<img src="' + src(it.img) + '" alt="' + esc(it.n) + '" width="1200" height="900" loading="lazy" decoding="async"' + IMGERR + '>' +
      '<span class="badge">' + price + '</span></div><span class="name">' + esc(it.n) + "</span></li>";
  }
  MENU.forEach(function (sec, si) {
    cats.insertAdjacentHTML("beforeend", '<a href="#' + sec.id + '" data-id="' + sec.id + '">' + esc(sec.nav) + "</a>");
    var head = '<div class="sec-head"><div><h2>' + esc(sec.title) + "</h2>" +
      (sec.gratine ? '<p class="sec-sub">Gratiné: zapiekany z serem na wierzchu, +4,50 zł</p>' : "") + "</div>" +
      (sec.gratine ? '<div class="switch" role="group" aria-label="Wersja tacosa"><button type="button" data-v="c" aria-pressed="true">Klasyczne</button><button type="button" data-v="g" aria-pressed="false">Gratiné</button></div>' : "") +
      "</div>";
    main.insertAdjacentHTML("beforeend", '<section class="sec" id="' + sec.id + '">' + head + '<ul class="grid">' +
      sec.items.map(function (it, i) { return tile(it, si, i); }).join("") + "</ul></section>");
  });
  function paint() {
    document.querySelectorAll("#tacos .tile").forEach(function (li, i) {
      var it = MENU[1].items[i], na = gratine && !it.g, v = variant(it, gratine);
      li.classList.toggle("na", na);
      var img = li.querySelector("img"); if (img) { img.src = src(v.img); img.alt = v.n; }
      li.querySelector(".name").textContent = v.n;
      li.querySelector(".badge").textContent = na ? "Tylko klasyczny" : zl(v.p);
    });
    document.querySelectorAll("#tacos .switch button").forEach(function (b) { b.setAttribute("aria-pressed", String((b.dataset.v === "g") === gratine)); });
  }
  document.querySelector("#tacos .switch").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) { gratine = b.dataset.v === "g"; paint(); }
  });
  renderHours(document.getElementById("hours"));
  openChip(document.getElementById("today"));
  setupSpy(cats, document.getElementById("bar"));
  // Deep links from Instagram link stickers: #autorskie #tacos #gratine #ricebox #dodatki #napoje #desery
  function jump() {
    var h = (location.hash || "").slice(1).toLowerCase();
    if (!h) return;
    if (h === "gratine") { gratine = true; paint(); h = "tacos"; }
    var el = document.getElementById(h);
    if (el) requestAnimationFrame(function () { el.scrollIntoView({ block: "start" }); });
  }
  jump();
  window.addEventListener("hashchange", jump);
})();
</script>
</body>
